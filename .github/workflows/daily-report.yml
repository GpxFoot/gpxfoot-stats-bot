name: GPXFoot Stats Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "50 6 * * *"
      timezone: "Europe/Paris"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - run: python -m compileall -q main.py src
      - run: python main.py
      - run: |
          git config user.name "GPXFoot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest_stats.json report.md
          git diff --cached --quiet || git commit -m "Update GPXFoot daily report"
          git push
